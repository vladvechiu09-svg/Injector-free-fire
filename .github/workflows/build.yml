name: Build hyravpn IPA

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o hyravpn.iOS.zip

      - name: Build IPA
        working-directory: hyravpn-ios
        run: |
          xcodebuild -project hyravpn.xcodeproj \
            -scheme hyravpn \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/hyravpn.app Payload/
          zip -qr hyravpn.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: hyravpn-IPA
          path: hyravpn-ios/hyravpn.ipa
